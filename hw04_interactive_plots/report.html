<!DOCTYPE html>
<html>
<head>
    <title>Static Visualization Report</title>
    <style>
        .section { margin-bottom: 40px; }
        .plots-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .plot { flex: 1; min-width: 300px; border: 1px solid #ddd; padding: 10px; }
        img { width: 100%; height: 500px; object-fit: contain;}
    </style>
</head>
<body>
    <!-- Plotly Plots -->
    <div class="section">
        <h2>Plotly Plots</h2>
        <div class="plots-container">
            <div class="plot">
                <img src="plots/plotly_plot1_data1.png" alt="Plotly Plot 1">
                <img src="plots/plotly_plot2_data2.png" alt="Plotly Plot 2">
            </div>
        </div>
    </div>

    <!-- mpld3 Plots (Now Static PNGs) -->
    <div class="section">
        <h2>mpld3 Plots</h2>
        <div class="plots-container">
            <div class="plot">
                <img src="plots/mpld3_plot1_data3.png" alt="mpld3 Plot 1">
                <img src="plots/mpld3_plot2_data4.png" alt="mpld3 Plot 2">
            </div>
        </div>
    </div>

    <!-- Pygal Plots (Now Static PNGs) -->
    <div class="section">
        <h2>Pygal Plots</h2>
        <div class="plots-container">
            <div class="plot">
                <img src="plots/pygal_plot1_data5.png" alt="Pygal Plot 1">
                <img src="plots/pygal_plot2_data6.png" alt="Pygal Plot 2">
            </div>
        </div>
    </div>
</body>
</html>
